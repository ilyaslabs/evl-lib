# Conformance cases for EVL-E011. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E011
cases:
  - name: "upper case and underscore"
    expect: present
    files:
      a.evl.yaml: |
        modules:
          - { id: Order_Svc, name: A }
  - name: "dotted lowercase"
    expect: absent
    files:
      a.evl.yaml: |
        modules:
          - { id: order.svc, name: A }
