# Conformance cases for EVL-W060. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-W060
cases:
  - name: "step only from annotation"
    expect: present
    annotations:
      - {"annotation": "Flow", "element": "a.Svc#run()", "elementKind": "METHOD", "package": "a", "line": 3, "attributes": {"id": "f", "category": "APPLICATION"}}
      - {"annotation": "Step", "element": "a.Svc#check()", "elementKind": "METHOD", "package": "a", "line": 6, "attributes": {"flow": "f", "step": "check"}}
  - name: "step declared in YAML"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - { id: f, steps: [ { id: check, name: Check } ] }
    annotations:
      - {"annotation": "Flow", "element": "a.Svc#run()", "elementKind": "METHOD", "package": "a", "line": 3, "attributes": {"id": "f", "category": "APPLICATION"}}
      - {"annotation": "Step", "element": "a.Svc#check()", "elementKind": "METHOD", "package": "a", "line": 6, "attributes": {"flow": "f", "step": "check"}}
