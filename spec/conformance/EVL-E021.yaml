# Conformance cases for EVL-E021. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E021
cases:
  - name: "kind prefix does not match"
    expect: present
    files:
      a.evl.yaml: |
        modules:
          - { id: order, name: O }
        components:
          - { id: c, name: C, module: "flow:order" }
  - name: "matching prefix"
    expect: absent
    files:
      a.evl.yaml: |
        modules:
          - { id: order, name: O }
        components:
          - { id: c, name: C, module: "module:order" }
