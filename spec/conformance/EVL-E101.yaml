# Conformance cases for EVL-E101. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E101
cases:
  - name: "duplicate key"
    expect: present
    files:
      a.evl.yaml: |
        modules:
          - id: a
            id: b
            name: A
  - name: "unique keys"
    expect: absent
    files:
      a.evl.yaml: |
        modules:
          - id: a
            name: A
