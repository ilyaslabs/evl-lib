# Conformance cases for EVL-W071. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-W071
cases:
  - name: "doc on a plain class"
    expect: present
    annotations:
      - {"annotation": "Doc", "element": "a.Plain", "elementKind": "TYPE", "package": "a", "line": 3, "attributes": {"value": "Hello"}}
  - name: "doc on a component"
    expect: absent
    annotations:
      - {"annotation": "Component", "element": "a.Svc", "elementKind": "TYPE", "package": "a", "line": 3, "attributes": {"id": "svc"}}
      - {"annotation": "Doc", "element": "a.Svc", "elementKind": "TYPE", "package": "a", "line": 4, "attributes": {"value": "Hello"}}
