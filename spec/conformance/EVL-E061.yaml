# Conformance cases for EVL-E061. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E061
cases:
  - name: "duplicate step id"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: A }
              - { id: s, name: B }
  - name: "unique step ids"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: A }
              - { id: t, name: B }
