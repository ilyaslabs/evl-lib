# Conformance cases for EVL-E106. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E106
cases:
  - name: "YAML flow without category"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - { id: f, name: F }
  - name: "with category"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - { id: f, name: F, category: APPLICATION }
