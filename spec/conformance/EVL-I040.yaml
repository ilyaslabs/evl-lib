# Conformance cases for EVL-I040. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-I040
cases:
  - name: "no code reference"
    expect: present
    files:
      a.evl.yaml: |
        components:
          - { id: a, name: A, source: { ref: x.A } }
          - { id: b, name: B, source: { ref: x.B } }
        dependencies:
          - { from: a, to: b }
    resolver: {"references": false}
  - name: "code reference found"
    expect: absent
    files:
      a.evl.yaml: |
        components:
          - { id: a, name: A, source: { ref: x.A } }
          - { id: b, name: B, source: { ref: x.B } }
        dependencies:
          - { from: a, to: b }
    resolver: {"references": true}
