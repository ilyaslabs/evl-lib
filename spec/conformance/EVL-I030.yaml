# Conformance cases for EVL-I030. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-I030
cases:
  - name: "unrealized business step"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: BUSINESS
            steps:
              - { id: s, name: S }
  - name: "realized step"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: BUSINESS
            steps:
              - { id: s, name: S, realizedBy: [g] }
          - { id: g, name: G, category: TECHNICAL }
