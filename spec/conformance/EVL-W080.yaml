# Conformance cases for EVL-W080. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-W080
cases:
  - name: "outside module packages"
    expect: present
    files:
      a.evl.yaml: |
        modules:
          - { id: m, name: M, packages: ["a.m.**"] }
        components:
          - { id: c, name: C, module: m, source: { ref: b.Other } }
  - name: "inside"
    expect: absent
    files:
      a.evl.yaml: |
        modules:
          - { id: m, name: M, packages: ["a.m.**"] }
        components:
          - { id: c, name: C, module: m, source: { ref: a.m.Svc } }
