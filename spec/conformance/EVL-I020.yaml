# Conformance cases for EVL-I020. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-I020
cases:
  - name: "YAML overrides a field"
    expect: present
    files:
      a.evl.yaml: |
        components:
          - { id: svc, description: yaml }
    annotations:
      - {"annotation": "Component", "element": "a.Svc", "elementKind": "TYPE", "package": "a", "line": 3, "attributes": {"id": "svc", "description": "code"}}
  - name: "YAML adds a field only"
    expect: absent
    files:
      a.evl.yaml: |
        components:
          - { id: svc, description: yaml }
    annotations:
      - {"annotation": "Component", "element": "a.Svc", "elementKind": "TYPE", "package": "a", "line": 3, "attributes": {"id": "svc"}}
