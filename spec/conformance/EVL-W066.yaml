# Conformance cases for EVL-W066. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-W066
cases:
  - name: "step after END"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: e, name: E, type: END }
              - { id: s, name: S }
  - name: "END last"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S }
              - { id: e, name: E, type: END }
