# Conformance cases for EVL-W021. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-W021
cases:
  - name: "flow calls itself"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S, type: CALL_FLOW, flow: f }
  - name: "no cycle"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S }
