# Conformance cases for EVL-W061. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-W061
cases:
  - name: "annotated flow without category"
    expect: present
    annotations:
      - {"annotation": "Flow", "element": "a.Svc#run()", "elementKind": "METHOD", "package": "a", "line": 3, "attributes": {"id": "f"}}
  - name: "with category"
    expect: absent
    annotations:
      - {"annotation": "Flow", "element": "a.Svc#run()", "elementKind": "METHOD", "package": "a", "line": 3, "attributes": {"id": "f", "category": "TECHNICAL"}}
