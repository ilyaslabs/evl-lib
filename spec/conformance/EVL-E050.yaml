# Conformance cases for EVL-E050. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E050
cases:
  - name: "document major differs"
    expect: present
    files:
      a.evl.yaml: |
        evl: "2.0"
        modules:
          - { id: m, name: M }
  - name: "same version"
    expect: absent
    files:
      a.evl.yaml: |
        evl: "1.0"
        modules:
          - { id: m, name: M }
