# Conformance cases for EVL-I041. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-I041
cases:
  - name: "resolver cannot tell"
    expect: present
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, source: { ref: k.Kotlin } }
    resolver: {"unchecked": ["k.Kotlin"]}
  - name: "resolved"
    expect: absent
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, source: { ref: k.Kotlin } }
    resolver: {}
