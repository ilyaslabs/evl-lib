# Conformance cases for EVL-E104. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E104
cases:
  - name: "unclosed bracket"
    expect: present
    files:
      a.evl.yaml: |
        modules: [
  - name: "valid YAML"
    expect: absent
    files:
      a.evl.yaml: |
        modules: []
