# Conformance cases for EVL-E012. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E012
cases:
  - name: "element without id"
    expect: present
    files:
      a.evl.yaml: |
        modules:
          - { name: A }
  - name: "element with id"
    expect: absent
    files:
      a.evl.yaml: |
        modules:
          - { id: a, name: A }
