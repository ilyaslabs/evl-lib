# Conformance cases for EVL-E060. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E060
cases:
  - name: "unknown step type"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S, type: WIGGLE }
  - name: "known type"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S, type: ACTION }
