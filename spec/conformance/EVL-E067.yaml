# Conformance cases for EVL-E067. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E067
cases:
  - name: "call without flow"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S, type: CALL_FLOW }
  - name: "call with flow"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S, type: CALL_FLOW, flow: f }
