# Conformance cases for EVL-E033. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E033
cases:
  - name: "dangling hash"
    expect: present
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, source: { ref: "a.B#" } }
  - name: "member reference"
    expect: absent
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, source: { ref: "a.B#m" } }
