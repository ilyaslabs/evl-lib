# Conformance cases for EVL-E031. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E031
cases:
  - name: "overloaded member"
    expect: present
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, source: { ref: "a.Svc#run" } }
    resolver: {"ambiguous": ["a.Svc#run"]}
  - name: "signature given"
    expect: absent
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, source: { ref: "a.Svc#run(String)" } }
    resolver: {}
