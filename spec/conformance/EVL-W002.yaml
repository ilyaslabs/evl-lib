# Conformance cases for EVL-W002. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-W002
cases:
  - name: "annotation without id"
    expect: present
    annotations:
      - {"annotation": "Component", "element": "a.OrderService", "elementKind": "TYPE", "package": "a", "line": 3, "attributes": {}}
  - name: "explicit id"
    expect: absent
    annotations:
      - {"annotation": "Component", "element": "a.OrderService", "elementKind": "TYPE", "package": "a", "line": 3, "attributes": {"id": "order.service"}}
