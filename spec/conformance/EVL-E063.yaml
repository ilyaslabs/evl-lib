# Conformance cases for EVL-E063. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E063
cases:
  - name: "one branch"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: d, name: D, type: DECISION, branches: [ { when: x, steps: [] } ] }
  - name: "branch plus otherwise"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: d, name: D, type: DECISION, branches: [ { when: x, steps: [] } ], otherwise: [] }
