# Conformance cases for EVL-E024. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E024
cases:
  - name: "redeclares a library element"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - { id: "payments-sdk:pay", name: Mine, category: APPLICATION }
    libraries:
      "payments-sdk":
        a.evl.yaml: |
          flows:
            - { id: pay, name: Pay, category: INTEGRATION }
  - name: "only references it"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S, type: CALL_FLOW, flow: "payments-sdk:pay" }
    libraries:
      "payments-sdk":
        a.evl.yaml: |
          flows:
            - { id: pay, name: Pay, category: INTEGRATION }
