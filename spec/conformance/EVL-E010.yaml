# Conformance cases for EVL-E010. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E010
cases:
  - name: "two YAML elements with one id"
    expect: present
    files:
      a.evl.yaml: |
        modules:
          - { id: order, name: A }
        components:
          - { id: order, name: B }
  - name: "distinct ids"
    expect: absent
    files:
      a.evl.yaml: |
        modules:
          - { id: order, name: A }
        components:
          - { id: order.service, name: B }
