# Conformance cases for EVL-E020. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E020
cases:
  - name: "YAML points elsewhere"
    expect: present
    files:
      a.evl.yaml: |
        components:
          - { id: order.service, source: { ref: a.Other } }
    annotations:
      - {"annotation": "Component", "element": "a.Order", "elementKind": "TYPE", "package": "a", "line": 3, "attributes": {"id": "order.service"}}
  - name: "YAML repeats the annotated type"
    expect: absent
    files:
      a.evl.yaml: |
        components:
          - { id: order.service, source: { ref: a.Order } }
    annotations:
      - {"annotation": "Component", "element": "a.Order", "elementKind": "TYPE", "package": "a", "line": 3, "attributes": {"id": "order.service"}}
