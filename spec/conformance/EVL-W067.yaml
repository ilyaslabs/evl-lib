# Conformance cases for EVL-W067. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-W067
cases:
  - name: "backward goto without when"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S }
              - { id: g, name: G, type: GOTO, target: s }
  - name: "with when"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: S }
              - { id: g, name: G, type: GOTO, target: s, when: "retry < 3" }
