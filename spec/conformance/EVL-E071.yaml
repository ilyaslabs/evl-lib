# Conformance cases for EVL-E071. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E071
cases:
  - name: "access key in text"
    expect: present
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, description: "key AKIAABCDEFGHIJKLMNOP" }
  - name: "ordinary text"
    expect: absent
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, description: "Reserves stock" }
