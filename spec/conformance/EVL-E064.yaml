# Conformance cases for EVL-E064. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E064
cases:
  - name: "one branch"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: p, name: P, type: PARALLEL, branches: [ { name: a, steps: [] } ] }
  - name: "two branches"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: p, name: P, type: PARALLEL, branches: [ { name: a, steps: [] }, { name: b, steps: [] } ] }
