# Conformance cases for EVL-W051. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-W051
cases:
  - name: "newer minor"
    expect: present
    files:
      a.evl.yaml: |
        evl: "1.9"
        modules: []
  - name: "current minor"
    expect: absent
    files:
      a.evl.yaml: |
        evl: "1.0"
        modules: []
