# Conformance cases for EVL-E062. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E062
cases:
  - name: "goto unknown step"
    expect: present
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: A }
              - { id: g, name: G, type: GOTO, target: nowhere, when: retry }
  - name: "goto known step"
    expect: absent
    files:
      a.evl.yaml: |
        flows:
          - id: f
            name: F
            category: APPLICATION
            steps:
              - { id: s, name: A }
              - { id: g, name: G, type: GOTO, target: s, when: retry }
