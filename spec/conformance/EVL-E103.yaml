# Conformance cases for EVL-E103. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E103
cases:
  - name: "string instead of list"
    expect: present
    files:
      a.evl.yaml: |
        modules:
          - { id: a, name: A, tags: core }
  - name: "list"
    expect: absent
    files:
      a.evl.yaml: |
        modules:
          - { id: a, name: A, tags: [core] }
