# Conformance cases for EVL-E107. 'present' cases must report the rule; 'absent' cases must not.
rule: EVL-E107
cases:
  - name: "invalid layer"
    expect: present
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, layer: TOP }
  - name: "valid layer"
    expect: absent
    files:
      a.evl.yaml: |
        components:
          - { id: c, name: C, layer: DOMAIN }
