name: Docs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: JavaDoc
        run: ./gradlew :evl-annotations:javadoc :evl-core:javadoc
      - name: Assemble site
        run: |
          mkdir -p site/javadoc
          cp -r docs spec examples README.md CHANGELOG.md site/
          sed -e "s#(\.\./#(#g" -e "s#(\([a-z-]*\.md\))#(docs/\1)#g" docs/index.md > site/index.md
          cp -r evl-annotations/build/docs/javadoc site/javadoc/annotations
          cp -r evl-core/build/docs/javadoc site/javadoc/core
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
