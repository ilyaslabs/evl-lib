name: Call CI/CD Release Workflow

on:
  release:
    types: [published]

jobs:
  release:
    uses: ilyaslabs/cicd/.github/workflows/gradle-release.yml@main
    secrets:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  cli-jar:
    # Attaches the runnable CLI jar to the GitHub release; skills download it from here.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build CLI jar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :evl-cli:allJar -Pversion="$VERSION"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" evl-cli/build/libs/evl-cli-*-all.jar --clobber
