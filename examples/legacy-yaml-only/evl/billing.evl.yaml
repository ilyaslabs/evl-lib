modules:
  - { id: billing, name: Billing, packages: ["com.legacy.billing.**"] }

components:
  - { id: billing.invoicer, name: Invoicer, module: billing, source: { ref: com.legacy.billing.Invoicer } }
  - { id: billing.ledger, name: Ledger, module: billing, source: { ref: com.legacy.billing.Ledger } }

dependencies:
  - { from: billing.invoicer, to: billing.ledger, type: DIRECT, reason: "Posts invoice totals" }

externalSystems:
  - { id: billing.mailer, name: Mail Gateway, systemType: EMAIL }

dataModels:
  - id: billing.invoice
    name: Invoice
    module: billing
    storage: oracle.invoices
    lifecycle:
      states: [DRAFT, ISSUED, PAID, VOID]
      transitions:
        - { from: DRAFT, to: ISSUED, by: billing.issue/issue }
        - { from: ISSUED, to: PAID, by: billing.issue }
    fields:
      - { name: total, meaning: "Invoice total", unit: EUR }

flows:
  - id: billing.issue
    name: Issue Invoice
    category: BACKGROUND
    module: billing
    trigger: "Nightly at 02:00"
    steps:
      - { id: collect, type: ACTION, name: Collect Billable Orders, component: billing.invoicer }
      - { id: issue, type: ACTION, name: Issue Invoices }
      - id: each
        type: PARALLEL
        name: Notify
        join: NONE
        branches:
          - { name: email, steps: [ { id: mail, type: ACTION, name: Email Customer, component: billing.invoicer } ] }
          - { name: ledger, steps: [ { id: post, type: ACTION, name: Post to Ledger, component: billing.ledger } ] }
      - { id: wait, type: WAIT, name: Wait for Ack, for: "Ledger acknowledgement", timeout: PT5M,
          onTimeout: [ { id: alert, type: NOTE, text: "Ops is paged" } ] }
